<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forecast finder App</title>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
  </head>
  <body>
    <header>
      <h2>Forecast Finder</h2>
    </header>
    <main class="app">
      <section class="main-info">
        <h1 id="current-city"></h1>
        <div id="current-icon"></div>
        <h3 id="current-day-display">
          <p class="currentTemp"><span id="todays-temp"></span>°C</p>
        </h3>
      </section>
      <hr />

      <section id="information-of-current-weather">
        <div>
          <p id="weather-info"></p>
          <p id="weather-values">
            Humidity: <span id="humidity-value"></span>% , Windspeed:
            <span id="windspeed-value"></span>km/h
          </p>
          <p id="current-day-info">
            <span id="date-and-day-info">
              <span id="day"></span> <span id="date"></span>.
              <span id="month"></span
            ></span>
            <span id="current-time-value"></span>
          </p>
        </div>
        <form id="search-tab">
          <input
            type="search"
            id="search-area"
            placeholder="Enter a city.."
            required
          />
          <input
            type="submit"
            value="🔍"
            id="search-button"
            aria-label="search-button"
          />
        </form>
      </section>
      <div class="weatherforecast" id="forecast"></div>
    </main>
    <footer>
      Coded by
      <a href="https://github.com/dev0ld" target="_blank"
        >Christina Devold Sedlmayr,</a
      >
      code hosted on
      <a href="https://github.com/dev0ld/forecast-finder" target="_blank"
        >GitHub</a
      >
      webpage hosted on
      <a href="https://forcast-finder-dvld.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="src/script.js"></script>
  </body>
</html>
